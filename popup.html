<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINN Commute Extension</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #0084ff;
    }
    
    .status {
      padding: 12px;
      background-color: #f0f8ff;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .status.configured {
      background-color: #d4edda;
      color: #155724;
    }
    
    .status.not-configured {
      background-color: #fff3cd;
      color: #856404;
    }
    
    .info {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    
    .info strong {
      color: #333;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background-color: #0084ff;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #0066cc;
    }
    
    .btn-secondary {
      background-color: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>🚇 FINN Commute Extension</h1>
  
  <div id="status" class="status">
    Loading configuration...
  </div>
  
  <div id="info" class="info"></div>
  
  <div class="actions">
    <button id="openOptions" class="btn-primary">Open Settings</button>
    <button id="clearCache" class="btn-secondary">Clear Cache</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
